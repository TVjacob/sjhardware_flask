version: '3.9'

services:
  # Postgres service (existing container)
  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: sjhardware
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Backend service
  backend:
    build: ./sjhardware_flask
    container_name: sj-backend
    environment:
      DATABASE_URL: postgresql://postgres:password1@postgres-db:5432/sjhardware
      SECRET_KEY: supersecretkey
      FLASK_APP: run.py
      FLASK_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: unless-stopped
    command: >
      sh -c "
      until psql $DATABASE_URL -c '\q'; do
        echo 'Waiting for Postgres...';
        sleep 2;
      done;
      flask db upgrade &&
      python run.py
      "

  # Frontend service
  frontend:
    build: ./sjhardware-frontend
    container_name: sj-frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    restart: unless-stopped
    command: >
      sh -c "
      npm install &&
      npm run dev -- --host 0.0.0.0
      "

volumes:
  pgdata:
